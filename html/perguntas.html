<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>

    <div><p>1. Qual a faixa etária da sua idade? </p></div>

    <div><input type="radio" class="dia" name="a.f" value="dia">
    <label for="dia">9-13 anos</label></div>
 
    <div><input type="radio" class="dia" name="a.f" value="dia">
    <label for="dia">14-18 anos</label></div>
    
    <div><input type="radio" class="dia" name="a.f" value="dia">
    <label for="dia">19-35 anos</label></div>

    <div><input type="radio" class="dia" name="a.f" value="dia">
    <label for="dia">mais de 35 anos</label></div>

    <div><button>próximo</button></div>

    <div><p>2. Qual sua faixa etária de peso?</p></div>

    <div><input type="radio" class="dia" name="a.f" value="dia">
    <label for="dia">25-45 quilos</label></div>

    <div><input type="radio" class="dia" name="a.f" value="dia">
    <label for="dia">46-75 quilos</label></div>

    <div><input type="radio" class="dia" name="a.f" value="dia">
    <label for="dia">76-85 quilos</label></div>

    <div><input type="radio" class="dia" name="a.f" value="dia">
    <label for="dia">acima de 85 quilos</label></div>

    <div><button>próximo</button></div>

    <div><p>3. Quantos litros de água você bebe por dia?</p></div>

    <div><input type="radio" class="dia" name="a.f" value="dia">
    <label for="dia">Menos de 1L</label></div>

     <div><input type="radio" class="dia" name="a.f" value="dia">
    <label for="dia">Entre 1L a 2L</label></div>

     <div><input type="radio" class="dia" name="a.f" value="dia">
    <label for="dia">Entre 2L a 5L</label></div>

    <div><input type="radio" class="dia" name="a.f" value="dia">
    <label for="dia">Mais de 5L</label></div>

    <div><button>próximo</button></div>

    <div><p>4. Quanto tempo de sono você consome?</p></div>

    <div><input type="radio" class="dia" name="a.f" value="dia">
    <label for="dia">Menos de 4h</label></div>

    <div><input type="radio" class="dia" name="a.f" value="dia">
    <label for="dia">Entre 4-7 horas</label></div>

    <div><input type="radio" class="dia" name="a.f" value="dia">
    <label for="dia">Mais de 8 horas</label></div>

    <div><button>próximo</button></div>

    <div><p>5. Quantas vezes por semana você pratica atividade física? </p></div>

    <div><input type="radio" class="dia" name="a.f" value="dia">
    <label for="dia">1-2 vezes</label></div>

    <div><input type="radio" class="dia" name="a.f" value="dia">
    <label for="dia">3-5 vezes</label></div>

    <div><input type="radio" class="dia" name="a.f" value="dia">
    <label for="dia">Todos os dias</label></div>

    <div><input type="radio" class="dia" name="a.f" value="dia">
    <label for="dia">Não faço atividade física</label></div>
    
    <div><button>próximo</button></div>

    <div><p>6. Com que frequência você sente dores de cabeça ao final do dia?</p></div>
    
    <div><input type="radio" class="dia" name="a.f" value="dia">
    <label for="dia">Raramente</label></div>

    <div><input type="radio" class="dia" name="a.f" value="dia">
    <label for="dia">Quando o dia está muito estressante ou pulo alguma refeição</label></div>

    <div><input type="radio" class="dia" name="a.f" value="dia">
    <label for="dia">Quase todos os dias,geralment6e acompanhada de tensão no pescoço.</label></div>

    <div><button>próximo</button></div>
